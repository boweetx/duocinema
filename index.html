<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoCinema — Кинозал для двоих</title>
    <!-- Шрифты и иконки -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MQTT WebSocket клиент для мгновенной синхронизации без сервера -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-base: #0b0a12;
            --bg-surface: #141221;
            --bg-elevated: #1e1b30;
            --primary: #ff4d6d;
            --primary-hover: #ff758f;
            --primary-glow: rgba(255, 77, 109, 0.35);
            --secondary: #7b2cbf;
            --text-main: #f8f9fa;
            --text-muted: #9a94b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 77, 109, 0.4);
            --online-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Фоновая динамическая подсветка */
        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 30%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(123, 44, 191, 0.15) 50%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        header {
            position: relative;
            z-index: 10;
            background: rgba(20, 18, 33, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .brand-text h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, #ffccd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .room-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-elevated);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .room-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            width: 110px;
            text-transform: uppercase;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--online-green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--online-green);
            box-shadow: 0 0 8px var(--online-green);
        }

        .status-dot.offline {
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .btn {
            background: var(--bg-elevated);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #e63946);
            border: none;
            color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            padding: 20px;
            max-width: 1700px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* Видео-зона */
        .video-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .source-selector {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .source-selector input[type="text"] {
            flex: 1;
            min-width: 200px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .source-selector input[type="file"] {
            display: none;
        }

        .screen-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border);
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Интерактив для пары */
        .reaction-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .emojis {
            display: flex;
            gap: 8px;
        }

        .emoji-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            font-size: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .emoji-btn:hover {
            transform: scale(1.25);
            background: rgba(255, 77, 109, 0.2);
            border-color: var(--primary);
        }

        .flying-emoji {
            position: absolute;
            bottom: 20px;
            font-size: 32px;
            pointer-events: none;
            z-index: 50;
            animation: flyUp 2.5s ease-out forwards;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            50% { transform: translateY(-120px) scale(1.3); opacity: 0.9; }
            100% { transform: translateY(-250px) scale(1); opacity: 0; }
        }

        /* Объятие поверх экрана */
        .hug-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 77, 109, 0.25);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .hug-overlay.active {
            opacity: 1;
            animation: hugPulse 3s ease forwards;
        }

        @keyframes hugPulse {
            0% { opacity: 0; transform: scale(0.95); }
            15% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .hug-box {
            background: var(--bg-surface);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 10px 40px var(--primary-glow);
        }

        /* Боковой чат */
        .chat-container {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            min-height: 480px;
        }

        .chat-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            font-size: 14px;
            font-weight: 700;
        }

        .messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg.me {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), #e63946);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .msg.partner {
            align-self: flex-start;
            background: var(--bg-elevated);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .msg.system {
            align-self: center;
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            max-width: 100%;
        }

        .chat-input-bar {
            padding: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .chat-input-bar input {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .chat-input-bar input:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="ambient-glow" id="ambient"></div>

    <header>
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-heart"></i></div>
            <div class="brand-text">
                <h1>DuoCinema</h1>
                <p>Личный кинозал для просмотра вдвоём</p>
            </div>
        </div>

        <div class="room-bar">
            <span>Комната:</span>
            <input type="text" id="roomInput" value="LOVE-01">
            <button class="btn btn-primary" onclick="changeRoom()"><i class="fa-solid fa-right-to-bracket"></i> Войти</button>
            <button class="btn" onclick="copyInviteLink()"><i class="fa-solid fa-copy"></i> Ссылка</button>
        </div>

        <div class="status-badge" id="statusBadge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Подключение...</span>
        </div>
    </header>

    <main>
        <div class="video-wrapper">
            <!-- Выбор источника -->
            <div class="source-selector">
                <input type="text" id="videoUrlInput" placeholder="Вставьте прямую ссылку (.mp4) или ссылку на видео..." value="https://vjs.zencdn.net/v/oceans.mp4">
                <button class="btn btn-primary" onclick="applyVideoUrl()"><i class="fa-solid fa-play"></i> Включить у обоих</button>
                
                <label class="btn" for="filePicker">
                    <i class="fa-solid fa-folder-open"></i> Локальный файл с ПК
                </label>
                <input type="file" id="filePicker" accept="video/*" onchange="loadLocalFile(event)">
            </div>

            <!-- Экран видео -->
            <div class="screen-container" id="screenBox">
                <video id="player" controls crossorigin="anonymous" playsinline>
                    <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4">
                </video>

                <div class="hug-overlay" id="hugOverlay">
                    <div class="hug-box">
                        <div style="font-size: 48px; margin-bottom: 8px;">💞</div>
                        <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 4px;">Крепкое объятие!</h2>
                        <p style="font-size: 13px; color: var(--text-muted);" id="hugSenderText">Твоя половинка обнимает тебя</p>
                    </div>
                </div>
            </div>

            <!-- Реакции и панель пары -->
            <div class="reaction-bar">
                <div class="emojis">
                    <button class="emoji-btn" onclick="sendReaction('❤️')">❤️</button>
                    <button class="emoji-btn" onclick="sendReaction('🥰')">🥰</button>
                    <button class="emoji-btn" onclick="sendReaction('🍿')">🍿</button>
                    <button class="emoji-btn" onclick="sendReaction('😂')">😂</button>
                    <button class="emoji-btn" onclick="sendReaction('🥺')">🥺</button>
                    <button class="emoji-btn" onclick="sendReaction('🔥')">🔥</button>
                </div>
                <button class="btn btn-primary" onclick="sendHug()"><i class="fa-solid fa-hand-holding-heart"></i> 💞 Обнять любимую</button>
            </div>
        </div>

        <!-- Чат -->
        <div class="chat-container">
            <div class="chat-header">
                <h3><i class="fa-solid fa-comments"></i> Чат для двоих</h3>
                <span style="font-size: 11px; color: var(--text-muted);" id="userNameDisplay">Вы: Я</span>
            </div>
            <div class="messages" id="messageList">
                <div class="msg system">Добро пожаловать в комнату! Все паузы и перемотки синхронизируются автоматически.</div>
            </div>
            <div class="chat-input-bar">
                <input type="text" id="chatInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button class="btn btn-primary" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <script>
        // Идентификация пользователя и комнаты
        const urlParams = new URLSearchParams(window.location.search);
        let currentRoom = (urlParams.get('room') || 'LOVE-01').toUpperCase();
        document.getElementById('roomInput').value = currentRoom;

        const clientId = 'user_' + Math.random().toString(36).substring(2, 9);
        const myName = urlParams.get('role') === 'girl' ? 'Любимая 🥰' : 'Я 🎬';
        document.getElementById('userNameDisplay').textContent = `Вы: ${myName}`;

        const video = document.getElementById('player');
        const messageList = document.getElementById('messageList');
        const statusBadge = document.getElementById('statusBadge');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let isIncomingSync = false; // Флаг для предотвращения бесконечного зацикливания событий
        let mqttClient = null;

        // Подключение к публичному защищённому брокеру EMQX (работает в РФ без блокировок)
        function initSync() {
            if (mqttClient) {
                mqttClient.end();
            }

            statusDot.className = 'status-dot offline';
            statusBadge.className = 'status-badge offline';
            statusText.textContent = 'Подключение...';

            const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
            mqttClient = mqtt.connect(brokerUrl, {
                clientId: clientId,
                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 2000
            });

            const topic = `duocinema/room/${currentRoom}`;

            mqttClient.on('connect', () => {
                statusDot.className = 'status-dot';
                statusBadge.className = 'status-badge';
                statusText.textContent = `В сети: ${currentRoom}`;

                mqttClient.subscribe(topic, { qos: 0 });
                // Оповещаем о входе
                publish({ type: 'presence', text: `${myName} вошёл(ла) в комнату` });
            });

            mqttClient.on('message', (t, payload) => {
                try {
                    const data = JSON.parse(payload.toString());
                    if (data.senderId === clientId) return; // Игнорируем собственные эхо-сообщения
                    handleIncomingSignal(data);
                } catch (e) {
                    console.error("Ошибка парсинга:", e);
                }
            });

            mqttClient.on('error', () => {
                statusDot.className = 'status-dot offline';
                statusBadge.className = 'status-badge offline';
                statusText.textContent = 'Сбой сети';
            });
        }

        function publish(data) {
            if (!mqttClient || !mqttClient.connected) return;
            data.senderId = clientId;
            data.senderName = myName;
            data.time = Date.now();
            mqttClient.publish(`duocinema/room/${currentRoom}`, JSON.stringify(data));
        }

        // Обработка команд от партнёра
        function handleIncomingSignal(data) {
            switch (data.type) {
                case 'play':
                    isIncomingSync = true;
                    if (Math.abs(video.currentTime - data.currentTime) > 1.2) {
                        video.currentTime = data.currentTime;
                    }
                    video.play().finally(() => { isIncomingSync = false; });
                    addSystemMessage(`${data.senderName} нажал(а) Play`);
                    break;

                case 'pause':
                    isIncomingSync = true;
                    video.pause();
                    if (Math.abs(video.currentTime - data.currentTime) > 1.2) {
                        video.currentTime = data.currentTime;
                    }
                    setTimeout(() => { isIncomingSync = false; }, 200);
                    addSystemMessage(`${data.senderName} поставил(а) на паузу (${formatTime(data.currentTime)})`);
                    break;

                case 'seek':
                    isIncomingSync = true;
                    video.currentTime = data.currentTime;
                    setTimeout(() => { isIncomingSync = false; }, 200);
                    addSystemMessage(`${data.senderName} перемотал(а) на ${formatTime(data.currentTime)}`);
                    break;

                case 'change_source':
                    isIncomingSync = true;
                    video.src = data.url;
                    video.load();
                    document.getElementById('videoUrlInput').value = data.url;
                    addSystemMessage(`${data.senderName} сменил(а) видео`);
                    setTimeout(() => { isIncomingSync = false; }, 300);
                    break;

                case 'chat':
                    appendMessage(data.text, 'partner', data.senderName);
                    break;

                case 'reaction':
                    renderFlyingEmoji(data.emoji);
                    break;

                case 'hug':
                    showHugAnimation(data.senderName);
                    break;

                case 'presence':
                    addSystemMessage(data.text);
                    break;
            }
        }

        // Синхронизация действий плеера
        video.addEventListener('play', () => {
            if (isIncomingSync) return;
            publish({ type: 'play', currentTime: video.currentTime });
        });

        video.addEventListener('pause', () => {
            if (isIncomingSync) return;
            publish({ type: 'pause', currentTime: video.currentTime });
        });

        video.addEventListener('seeked', () => {
            if (isIncomingSync) return;
            publish({ type: 'seek', currentTime: video.currentTime });
        });

        // Смена видео
        function applyVideoUrl() {
            const url = document.getElementById('videoUrlInput').value.trim();
            if (!url) return;
            video.src = url;
            video.load();
            video.play();
            publish({ type: 'change_source', url: url });
        }

        function loadLocalFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const fileUrl = URL.createObjectURL(file);
            video.src = fileUrl;
            video.load();
            video.play();
            addSystemMessage(`Загружен локальный файл: ${file.name}. Убедитесь, что у девушки выбран этот же файл!`);
        }

        // Чат
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            appendMessage(text, 'me', myName);
            publish({ type: 'chat', text: text });
            input.value = '';
        }

        function appendMessage(text, type, sender) {
            const el = document.createElement('div');
            el.className = `msg ${type}`;
            el.innerHTML = `<strong>${sender}:</strong> ${text}`;
            messageList.appendChild(el);
            messageList.scrollTop = messageList.scrollHeight;
        }

        function addSystemMessage(text) {
            const el = document.createElement('div');
            el.className = 'msg system';
            el.textContent = text;
            messageList.appendChild(el);
            messageList.scrollTop = messageList.scrollHeight;
        }

        // Реакции и анимации
        function sendReaction(emoji) {
            renderFlyingEmoji(emoji);
            publish({ type: 'reaction', emoji: emoji });
        }

        function renderFlyingEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'flying-emoji';
            el.textContent = emoji;
            el.style.left = Math.floor(Math.random() * 60 + 20) + '%';
            document.getElementById('screenBox').appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function sendHug() {
            showHugAnimation('Вы');
            publish({ type: 'hug' });
        }

        function showHugAnimation(sender) {
            const overlay = document.getElementById('hugOverlay');
            document.getElementById('hugSenderText').textContent = sender === 'Вы' ? 'Вы отправили объятие ❤️' : `${sender} крепко обнимает вас 🥰`;
            overlay.classList.add('active');
            setTimeout(() => overlay.classList.remove('active'), 3000);
        }

        // Управление комнатой
        function changeRoom() {
            const val = document.getElementById('roomInput').value.trim().toUpperCase();
            if (!val || val === currentRoom) return;
            currentRoom = val;
            window.history.pushState({}, '', `?room=${currentRoom}`);
            initSync();
            addSystemMessage(`Вы перешли в комнату ${currentRoom}`);
        }

        function copyInviteLink() {
            const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoom}&role=girl`;
            navigator.clipboard.writeText(inviteUrl);
            alert(`Ссылка скопирована!\n\nОтправьте её девушке:\n${inviteUrl}`);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Запуск
        initSync();
    </script>
</body>
